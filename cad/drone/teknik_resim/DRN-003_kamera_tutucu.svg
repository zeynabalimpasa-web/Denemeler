, Helvetica, sans-serif" text-anchor="middle" fill="#000">mm</text><text x="321.500" y="280.200" font-size="2.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#555">İzdüşüm</text><text x="342.500" y="285.200" font-size="3.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#000">ISO E (1. açı)</text><text x="366.500" y="280.200" font-size="2.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#555">Format</text><text x="387.500" y="285.200" font-size="3.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#000">A3</text><text x="25.000" y="255.000" font-size="3.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#000" font-weight="bold">NOTLAR</text><text x="25.000" y="261.000" font-size="2.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#000">1. Ölçüler mm'dir. Toleransı belirtilmeyen doğrusal ölçüler ±0.3 (ISO 2768-c, FDM'e uyarlanmış).</text><text x="25.000" y="267.000" font-size="2.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#000">2. Delikler nominal ölçüdedir (ISO 273 orta seri geçme). STL modelinde +0.1 mm FDM telafisi vardır; küçük çıkan delik matkapla düzeltilebilir.</text><text x="25.000" y="273.000" font-size="2.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#000">3. Baskı: PETG, 0.4 mm nozül, 0.25 mm katman (tüm yükseklikler katın tam katı), 4 çevre, %40 gyroid dolgu.</text><text x="25.000" y="279.000" font-size="2.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="start" fill="#000">4. Parça baskı tablasına çizimdeki üstten görünüşteki gibi yatırılır; destek gerekmez.</text></svg>